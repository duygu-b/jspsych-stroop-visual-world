			choices: ['<b>Start Trial</b>'],

        const instructions2 = {

            stimulus: '<p style="font-size: 20px;"> Let\'s try the colour-word task.</p> <h3>Select the ink colour of the word.</h3>',
			choices: ['Next'],

        };
        const instructions3 = {
            type: jsPsychHtmlButtonResponse,
            stimulus: '<h2> Great! </h2><p style="font-size: 20px;"> Now, let\'s try the language task.</p><h3> You will hear a sentence, and drag and drop the object.</h3><p> Please make sure your computer\'s <b>SOUND IS ON.</b></p><h4> Please DO NOT use Bluetooth headphones, as they may cause audio delays.</h4>',
			choices: ['Next'],
        };
        


        //Functions
        function checkAccuracy(final_locations, correct_image, target_image) {
            const obj = final_locations.find(o => o.src.includes(correct_image));
            const target = final_locations.find(o => o.src.includes(target_image));

            if (!obj || !target) {
                return 0;
            }

            const objLeft   = obj.x;
            const objRight  = obj.x + 100;
            const objTop    = obj.y;
            const objBottom = obj.y + 100;

            const targetLeft   = target.x;
            const targetRight  = target.x + 100;
            const targetTop    = target.y;
            const targetBottom = target.y + 100;

            const overlaps =
                objRight  >= targetLeft  &&
                objLeft   <= targetRight &&
                objBottom >= targetTop   &&
                objTop    <= targetBottom;

                if (overlaps) {
                    return 1;
                } else {
                return 0;
            }
        }
        function getFilenameFromSrc(src) {
            let filename = src.split("/").pop().split("?")[0]; 
            return filename;
        }
        const positions = [
            {x: 100, y: 100, quadrant: "top_left"},
            {x: 400, y: 100, quadrant: "top_right"},
            {x: 100, y: 350, quadrant: "bottom_left"},
            {x: 400, y: 350, quadrant: "bottom_right"}
        ];

        // Takes the free-sort area's ACTUAL on-screen bounding box(getBoundingClientRect, same coordinate space as WebGazer's g.x/g.y) and splits it into 4 equal quadrants. Returns both the arearect
        // and the real screen-space rect of each of the 4 quadrants, so we can report quadrant NAME + LOCATION together.
        function computeQuadrantBoundaries() {

            const area = document.querySelector('#jspsych-free-sort-arena')
                      || document.querySelector('.jspsych-free-sort-arena');

            if (!area) {
                console.warn('[quadrant] #jspsych-free-sort-arena not found');
                console.warn('[quadrant] body HTML for inspection:', document.body.innerHTML.slice(0, 2000));
                return null;
            }
            console.log('[quadrant] matched container:', area);

            const rect = area.getBoundingClientRect();
            console.log('[quadrant] container rect:', rect);
            const areaLeft   = rect.left + window.scrollX;
            const areaTop    = rect.top + window.scrollY;
            const areaWidth  = rect.width;
            const areaHeight = rect.height;
            const middleX = areaLeft + areaWidth / 2;
            const middleY = areaTop + areaHeight / 2;

            const boundaries = {
                areaRect: { left: areaLeft, top: areaTop, width: areaWidth, height: areaHeight },
                middleX, middleY
            };
            console.log('[quadrant] computed boundaries:', boundaries);
            return boundaries;
        }

        // Assigns a screen-space point (x, y) to a quadrant name using the
        // real area-based boundaries above.
        function getQuadrantFromScreenXY(x, y, boundaries) {
            if (!boundaries) {
                if (!window._warnedNoBoundaries) {
                    console.warn('[quadrant] no boundaries available, gaze point:', x, y);
                    window._warnedNoBoundaries = true;
                }
                return "outside";
            }
            const { middleX, middleY } = boundaries;

            if (x < middleX && y < middleY)       return "top_left";
            if (x >= middleX && y < middleY)      return "top_right";
            if (x < middleX && y >= middleY)      return "bottom_left";
            return "bottom_right";
        }

        // Updates the interface once gaze data starts coming in
        function updateValidationUI() {
            const status = document.getElementById('status-text');
            const dot = document.getElementById('target-dot');
            const instr = document.getElementById('instruction-text');
            
            if (status) {
                status.innerText = "System Ready";
                status.style.color = "green";
                dot.style.opacity = "1";
                instr.style.visibility = "visible";
            }
        }
        function calculateValidationError(gazeData) {
            if (!gazeData) return null;

            // Assumes the purple dot sits at the centre of the screen
            const targetX = window.innerWidth / 2;
            const targetY = window.innerHeight / 2;

            const dx = gazeData.x - targetX;
            const dy = gazeData.y - targetY;

            return Math.sqrt(dx * dx + dy * dy); // pixel error
        }

        // A clean helper for the keyboard check
        function handleValidationSpace(e) {
            if (e.code === 'Space' && lastGazeData) {
                window.removeEventListener('keydown', handleValidationSpace);
                jsPsych.finishTrial();
            }
        }

        //Stroop
        const colours = ['red', 'green', 'blue'];

        function congruent() {
            const c = jsPsych.randomization.sampleWithReplacement(colours, 1)[0];
            return { text: c, colour: c, condition: 'congruent' };
        }
        function incongruent() {
            const c = jsPsych.randomization.sampleWithoutReplacement(colours, 2);
            return { text: c[0], colour: c[1], condition: 'incongruent' };
        }

        const fixation_stroop = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<p style="font-size:60px">+</p>',
            trial_duration: 500,
            response_ends_trial: false
        };
        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            trial_duration: 250,
            response_ends_trial: false
        };
        function makeStroopTrial(values, phase = "main") {
            const colourMap = { red: 0, green: 1, blue: 2 };
            return {
                timeline: [iti, fixation_stroop, {
                    type: jsPsychHtmlButtonResponse, 
                    stimulus: `<p style="font-size:60px; color:${values.colour}">${values.text}</p>`,
                    choices: [
                        '<div style="width:60px; height:60px; background-color:red; border:1px solid black; border-countsroi_counts:5px;"></div>',
                        '<div style="width:60px; height:60px; background-color:green; border:1px solid black; border-countsroi_counts:5px;"></div>',
                        '<div style="width:60px; height:60px; background-color:blue; border:1px solid black; border-countsroi_counts:5px;"></div>'
                    ],
                    data:{ task: 'stroop', phase: phase, values, correct_response: colourMap[values.colour] },
                    on_finish: function(data) {
                        data.correct = data.response == data.correct_response;
                    }
                }]
            };
        }
        let extra_stroops = [];
        for (let i = 0; i < 60; i++) {
        let values = (i % 2 === 0) ? congruent() : incongruent();
        extra_stroops.push([makeStroopTrial(values)]);
        }
        const stroop_feedback = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function () {
                const lastStroop = jsPsych.data.get().filter({task: 'stroop'}).last(1).values()[0];
                if (lastStroop.correct) {
                    return '<p style="color:green; font-size:28px;">Correct!</p>';
                }
                else {
                    return '<p style="color:red; font-size:28px;">Oops! Select the ink colour!</p>';
                }
            },
            choices: "NO_KEYS",
            trial_duration: 1100
        };
        function repeatTillCorrectStroop (values) {
            return {
                timeline: [makeStroopTrial(values, phase = "practice"), stroop_feedback],
                loop_function: function () {
                    const trials = jsPsych.data.get().filter({task: 'stroop'}).last(1).values(); // the last two trials: Stroop + feedback
                    const stroop_trial = trials[0]; // the first one is the Stroop trial
                    return !stroop_trial.correct; // repeat if incorrect
                }
            };
        }
        // 2) Stroop examples
        const practice_congruent1 = repeatTillCorrectStroop(congruent()); 
        const practice_incongruent1 = repeatTillCorrectStroop(incongruent());
        const practice_congruent2 = repeatTillCorrectStroop(congruent());
        const practice_incongruent2 = repeatTillCorrectStroop(incongruent());

        //Visual World
        const preload = {
            type: jsPsychPreload,
            audio: ["audio/amb1.wav", "audio/amb2.wav", "audio/amb3.wav", "audio/amb4.wav", "audio/amb5.wav", "audio/amb6.wav", "audio/amb7.wav", "audio/amb8.wav", "audio/amb9.wav", "audio/amb10.wav", "audio/amb11.wav", "audio/amb12.wav", "audio/amb13.wav", "audio/amb14.wav", "audio/amb15.wav", "audio/amb16.wav", "audio/amb17.wav", "audio/amb18.wav", "audio/amb19.wav", "audio/amb20.wav",
            "audio/unamb1.wav", "audio/unamb2.wav", "audio/unamb3.wav", "audio/unamb4.wav", "audio/unamb5.wav", "audio/unamb6.wav", "audio/unamb7.wav", "audio/unamb8.wav", "audio/unamb9.wav", "audio/unamb10.wav", "audio/unamb11.wav", "audio/unamb12.wav", "audio/unamb13.wav", "audio/unamb14.wav", "audio/unamb15.wav", "audio/unamb16.wav", "audio/unamb17.wav", "audio/unamb18.wav", "audio/unamb19.wav", "audio/unamb20.wav",   
            "audio/filler1.wav"],
            images: [
                "images/frog.png", "images/box1.png", "images/box2.png","images/napkin1.png", "images/napkin2.png","images/horse.png",
                "images/rabbit.png", "images/tray1.png", "images/tray2.png","images/towel1.png", "images/towel2.png", "images/bird.png",
                "images/panda.png", "images/chair.png", "images/blanket1.png", "images/blanket2.png","images/cow.png",
                "images/cat.png", "images/shelf.png", "images/pillow1.png", "images/pillow2.png", "images/sheep.png",
                "images/brush.png", "images/table.png", "images/magazine1.png", "images/magazine2.png","images/wrench.png",
                "images/marker.png", "images/scarf.png", "images/stapler.png",
                "images/orange.png", "images/plate1.png", "images/plate2.png", "images/pear.png", "images/bell.png", "images/whistle.png", "images/candle.png", "images/card.png", "images/lamp.png",
                "images/glasses1.png", "images/glasses2.png", "images/book1.png", "images/book2.png", "images/glove1.png", "images/glove2.png", "images/hat.png",
                "images/hammer.png", "images/tshirt.png", "images/nail.png", "images/rock.png", "images/flower.png", "images/pen.png", "images/desk.png", "images/notebook1.png", "images/notebook2.png", "images/ruler.png",
                "images/cup.png", "images/fork.png", "images/phone.png", "images/shelf.png", "images/folder1.png", "images/folder2.png", "images/clock.png",
                "images/chair.png", "images/calendar1.png", "images/calendar2.png", "images/envelope.png", "images/bench.png", "images/placemat1.png", "images/placemat2.png", "images/spoon.png", "images/card.png", "images/rug.png", "images/ticket.png", "images/couch.png",
                "images/sticker.png", "images/mat.png", "images/paper1.png", "images/paper2.png","images/tag.png", "images/bottle.png"
            ]
        };

        const eligible_text = {
            type: jsPsychHtmlButtonResponse,
            stimulus: "<h2>Thank you!</h2> <p>Click the button below to start the experiment.</p>",
            choices: ["Start"],
        };
        const calibration = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
                <p>
                This experiment uses your <b>webcam for eye-tracking.</b>
                </p>
                <p>
                Before the experiment starts, we will run a short calibration.
                During <b>calibration</b>, please <b> allow camera access </b> and look at the screen.
                </p>
                <h3>Please make sure <span style="color: blue;">the room is well-lit</span> and <span style="color: blue;">your face remains clearly visible to the camera THROUGHOUT the experiment.</span></h3>
                <p>
                No video will be recorded or stored.
                </p>
                <p>
                When you are ready, click the button below to start the calibration.
                </p>
            `,
            choices: ["Start calibration"],
            on_finish: async function () {
                await webgazer.clearGazeListener();
                await webgazer.begin();
                webgazer.showPredictionPoints(true);
                webgazer.showVideoPreview(true);
                webgazer.showFaceOverlay(true);
            }
        };
        // simple 9-point click calibration 
        // The participant looks at each red dot and clicks it 3 times; WebGazer trains the model from these clicks.
        const calibration_dots = {
            type: jsPsychHtmlKeyboardResponse,
            record_data: false,
            stimulus: '<p id="calib-text">Please wait, the camera is starting...</p>',
            choices: "NO_KEYS",
            on_load: function () {
                const points = jsPsych.randomization.shuffle(
                    [[10,10],[50,10],[90,10],[10,50],[50,50],[90,50],[10,90],[50,90],[90,90]]
                );
                const CLICKS = 3;

                function start() {
                    // Keep the video preview and the prediction dot from interfering with calibration
                    webgazer.showVideoPreview(false);
                    webgazer.showFaceOverlay(false);
                    webgazer.showPredictionPoints(false);
                    document.getElementById('calib-text').innerHTML =
                        'Look at each red dot and click on it ' + CLICKS + ' times.';

                    const dot = document.createElement('div');
                    dot.style.cssText = 'position:fixed; width:24px; height:24px; border-radius:50%;' +
                        'background:red; transform:translate(-50%,-50%); cursor:pointer; z-index:100000;';
                    document.body.appendChild(dot);

                    let i = 0, clicks = 0;
                    function place() {
                        dot.style.left = points[i][0] + '%';
                        dot.style.top = points[i][1] + '%';
                        dot.style.opacity = 1;
                        clicks = 0;
                    }
                    dot.addEventListener('click', function () {
                        clicks++;
                        dot.style.opacity = 1 - clicks * 0.25;
                        if (clicks >= CLICKS) {
                            i++;
                            if (i < points.length) {
                                place();
                            } else {
                                dot.remove();
                                // Turn the visual helpers back on for the validation step that follows
                                webgazer.showVideoPreview(true);
                                webgazer.showFaceOverlay(true);
                                webgazer.showPredictionPoints(true);
                                jsPsych.finishTrial({ phase: 'calibration' });
                            }
                        }
                    });
                    place();
                }

                // Wait until WebGazer is ready (camera permission etc.)
                (function waitReady() {
                    if (webgazer.isReady && webgazer.isReady()) start();
                    else setTimeout(waitReady, 200);
                })();
            }
        };
        const validation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;">
                    <div style="text-align: center;">
                        <p><b>Quality Check</b></p>
                        <p>Please click anywhere on the screen and wait until a <b>MOVING RED DOT</b> appears (this shows your eye movements are being tracked).</p> 
                        <p>Then, look at the <b>PURPLE DOT</b>.</p>
                        <p>Make sure the <b>MOVING RED DOT</b> is following your eye movements. Then press <b>SPACE</b>.</p>
                        <div style="width: 20px; height: 20px; background: purple; border-countsroi_counts: 50%; margin: 20px auto; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>
                    </div>
                </div>
            `,
            choices: "NO_KEYS",
            on_load: function() {
            // Start the gaze listener here so that WebGazer is forced to run in the background
                webgazer.setGazeListener((data) => {
                    if (data) {
                        lastGazeData = data;
                        updateValidationUI(); // highlight the interface
                        window.addEventListener('keydown', handleValidationSpace); // enable the key
                    }
                });
            },
            on_finish: function(data) {
                data.validation_error_px = calculateValidationError(lastGazeData);
                data.phase = "validation";
                
                webgazer.clearGazeListener();
            }
        };
        const start_experiment = {
            type: jsPsychHtmlButtonResponse,
            stimulus: '<h2>Well done!</h2><p> Now, when you\'re ready, click the button below to begin the main experiment.</p>',
			choices: ['<b>Start Experiment</b>'],
        };
        const fixation_vw = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<p style="font-size: 48px;">+</p>',
            choices: "NO_KEYS",
            trial_duration: 500,
            on_load: function() {
                // 1. Open an empty list to collect the samples
                window.tempGazeSamples = [];
                // 2. Start listening to WebGazer
                webgazer.setGazeListener((data) => {
                    if (data) {
                        window.tempGazeSamples.push({x: data.x, y: data.y});
                    }
                });
            },
            on_finish: function(data) {
                // 3. Stop listening (important: otherwise it keeps running in the background)
                webgazer.clearGazeListener();

                // 4. If samples came in, average them and compute the error
                if (window.tempGazeSamples.length > 0) {
                    const avgX = window.tempGazeSamples.reduce((s, a) => s + a.x, 0) / window.tempGazeSamples.length;
                    const avgY = window.tempGazeSamples.reduce((s, a) => s + a.y, 0) / window.tempGazeSamples.length;
                    
                    const targetX = window.innerWidth / 2;
                    const targetY = window.innerHeight / 2;
                    
                    // Euclidean distance (deviation in pixels)
                    data.trial_validation_error = Math.sqrt(Math.pow(avgX - targetX, 2) + Math.pow(avgY - targetY, 2));
                } else {
                    data.trial_validation_error = null;
                }
            }
        };
        const drag_drop = {
            type: jsPsychFreeSort,
            stimuli: jsPsych.timelineVariable("images"),
            start_positions: function() {
                const s = jsPsych.randomization.shuffle(positions);
                const num_images = jsPsych.evaluateTimelineVariable("images").length;

                if (num_images === 5) {
                    // Critical trial: Napkin and Frog should overlap (5 images, 4 locations)
                    return [s[0], s[0], s[1], s[2], s[3]];
                } else {
                    // Filler trial: each image in its own corner (4 images, 4 locations)
                    return [s[0], s[1], s[2], s[3]];
                }
            },
            stim_width: 100,
            stim_height: 100,
            sort_area_width: 600,
            sort_area_height: 500,
            stim_starts_inside: true,
            prompt: "<p>Listen and then drag-drop the correct image.</p>",
            data: { task: 'free-sort',
                sentence_id: jsPsych.timelineVariable("sentence_id"),
                condition: jsPsych.timelineVariable("condition"),
                correct_image: jsPsych.timelineVariable("correct_image"),
                target_image: jsPsych.timelineVariable("target_image"),
                distractor: jsPsych.timelineVariable("distractor")
            },

            on_start: function() {
                // 1. Hide the cursor and disable interaction - CSS hides the cursor completely, everywhere
                const style = document.createElement('style');
                style.id = 'hide-cursor';
                style.innerHTML = '* { cursor: none !important; }';
                document.head.appendChild(style);

                const area = document.querySelector('.jspsych-free-sort-area');
                if(area) area.style.pointerEvents = 'none';

                // 2. Audio handling
                const audioPath = jsPsych.evaluateTimelineVariable("audio");
                window.currentAudio = new Audio(audioPath);
                
                // Trial start time (for reference)
                window.trialStartGlobal = performance.now();

                // The moment actual playback begins
                window.currentAudio.addEventListener("playing", function() {
                    window.audioStartGlobal = performance.now();
                });

                window.currentAudio.onended = function() {
                    const cursorStyle = document.getElementById('hide-cursor');
                    if (cursorStyle) cursorStyle.remove(); // When the audio ends, remove the style and enable interaction
                    if(area) area.style.pointerEvents = 'auto';
                };

                //start after a 300ms delay
                setTimeout(() => {
                    window.currentAudio.play();
                }, 300);

                window.currentAudio.play();

                // 3. Mouse trajectory recording
                window.mouse_trajectory = [];
                window.mouseListener = (e) => {
                    window.mouse_trajectory.push({x: e.clientX, y: e.clientY, t: performance.now()});
                };
                document.addEventListener('mousemove', window.mouseListener);
            },
            on_load: function() {
                console.log('[quadrant] drag_drop on_load fired');
                // compute real screen-space quadrant boundaries 
                window.quadrantBoundaries = computeQuadrantBoundaries();

                // Count how many gaze samples landed in each quadrant, instead
                // of storing every raw sample.
                window.gaze_counts = {
                    top_left: 0,
                    top_right: 0,
                    bottom_left: 0,
                    bottom_right: 0,
                    outside: 0
                };
                window.last_quadrant = null;
                window.gaze_transitions = [];
                // keep the raw gaze samples together with timestamp + quadrant
                window.gaze_samples = [];

                // WebGazer listener
                webgazer.setGazeListener((g, time) => {
                    if (!g) return;

                    const x = g.x;
                    const y = g.y;

                    const quadrant = getQuadrantFromScreenXY(x, y, window.quadrantBoundaries);
                    const t = performance.now();

                    // Tally this sample into its quadrant's count
                    if (window.gaze_counts[quadrant] === undefined) {
                        window.gaze_counts[quadrant] = 0;
                    }
                    window.gaze_counts[quadrant]++;

                    // store every sample in raw form
                    window.gaze_samples.push({
                        quadrant: quadrant,
                        x: x,
                        y: y,
                        t: t
                    });

                    // Gaze transitions (quadrant changes over time)
                    if (quadrant !== window.last_quadrant) {
                        window.gaze_transitions.push({
                            quadrant: quadrant,
                            x: x,
                            y: y,
                            t: t
                        });

                        window.last_quadrant = quadrant;
                    }
                });
            },

            on_finish: function (data){
                data.init_locations = data.init_locations.map(obj => ({
                    ...obj,
                    quadrant: positions.find(
                        p => p.x === obj.x && p.y === obj.y
                    )?.quadrant || "unknown"
                }));

                data.final_locations = data.final_locations.map(obj => {
                    const position = positions.find(
                        p => p.x === obj.x && p.y === obj.y
                    );
                    return {
                        ...obj,
                        quadrant: position ? position.quadrant : "unknown"
                    };
                });
                document.removeEventListener('mousemove', window.mouseListener);

        const filler = sentences.filter(s => s.condition === "filler");
        const practice_sent = sentences.find(s => s.condition === "practice");
        
        function makeVWBlock(sentence) {
            // Important: wrap the drag_drop object in a structure compatible with timeline_variables
            return [{
                timeline: [fixation_vw, drag_drop],
                timeline_variables: [sentence] // Give each block its corresponding sentence
            }];
        }

            type: jsPsychHtmlKeyboardResponse,
            stimulus: function () {
                // Pull the most recent drag-and-drop data
                const last_trial = jsPsych.data.get().filter({trial_type: 'free-sort'}).last(1).values()[0];

                // If there is data and accuracy is 1 (correct)
                if (last_trial && last_trial.accuracy === 1) {
                    return '<p style="color:green; font-size:24px;">Correct!</p>';
                } 
                // If there is no data or accuracy is 0 (incorrect)
                else {
                    return '<p style="color:red; font-size:24px;">Incorrect! Try again.</p>';
                }
            },
            choices: "NO_KEYS",
            trial_duration: 900
        };
        function repeatTillCorrectDragDrop(values) {
            return {
                timeline: [
                    fixation_vw, 
                    {
                        timeline: [drag_drop],
                        timeline_variables: [values]
                    },
                    feedback_vw
                ],
                loop_function: function(data) {
                    // 1. Pull the most recent free-sort data
                    var last_trial = data.filter({trial_type: 'free-sort'}).last(1).values()[0];

                    // 2. Check: if accuracy is 1 move on, if 0 repeat
                    if (last_trial) {
                        if (last_trial.accuracy == 1) {
                            return false; // Correct, EXIT the loop
                        } else {
                            return true;  // Incorrect, GO BACK to the start
                        }
                    }
                    return false; // If no data is found, carry on so it doesn't get stuck
                }
            };
        }

        let amb_shuffled = jsPsych.randomization.shuffle(amb);

        let amb_pairs = amb_shuffled.map((s, i) => {
        let stroop = (i < 10) ? congruent() : incongruent();
